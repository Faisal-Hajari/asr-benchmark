[project]
name = "asr-benchmark"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Faisal Alhajari", email = "faisalhejary@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "editdistance>=0.8.1",
    "huggingface-hub>=1.33.0",
    "humain-voice>=0.19.0",
    "litellm>=1.102.1",
    "mistral-common[audio]>=1.11.5",
    "numpy>=2.0",
    "pillow>=13.0.0",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.2",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
